name: Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'src/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'README.md'
      - 'scripts/docs/**'
      - '.github/workflows/docs-build.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'src/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'README.md'
      - 'scripts/docs/**'
      - '.github/workflows/docs-build.yml'

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

  # Temporary until GitHub fully migrates Actions to Node 24.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build:

    name: Build Documentation

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Install DocFX
        run: dotnet tool install -g docfx

      - name: Check documentation parity (en/ar)
        shell: pwsh
        run: pwsh scripts/docs/check-doc-parity.ps1

      - name: Check README claims
        shell: pwsh
        run: pwsh scripts/docs/check-readme-claims.ps1

      - name: Build Documentation Site
        run: docfx docs/docfx.json --warningsAsErrors

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: docs/_site

  deploy:

    name: Deploy GitHub Pages

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    needs:
      - build

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5.0.1
