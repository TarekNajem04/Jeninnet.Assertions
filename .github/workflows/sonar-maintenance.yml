name: Sonar Maintenance

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Operation to run against the SonarCloud project"
        required: true
        default: "list"
        type: choice
        options:
          - "list"
          - "rename-main"
          - "delete-branch"
          - "quality-gate"
      branch:
        description: "Branch name (delete-branch only)"
        required: false
        default: "main"

permissions:
  contents: read

jobs:
  maintenance:
    name: SonarCloud maintenance
    runs-on: ubuntu-latest

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      PROJECT: jeninnet-assertions

    steps:
      - name: List branches
        if: inputs.action == 'list'
        run: |
          curl -sS -u "$SONAR_TOKEN:" "https://sonarcloud.io/api/project_branches/list?project=$PROJECT"

      - name: Rename main branch
        if: inputs.action == 'rename-main'
        run: |
          curl -sS -u "$SONAR_TOKEN:" -X POST "https://sonarcloud.io/api/project_branches/rename?project=$PROJECT&name=main"

      - name: Delete branch
        if: inputs.action == 'delete-branch'
        run: |
          curl -sS -u "$SONAR_TOKEN:" -X POST "https://sonarcloud.io/api/project_branches/delete?project=$PROJECT&branch=${{ inputs.branch }}"

      - name: Quality gate details
        if: inputs.action == 'quality-gate'
        run: |
          echo "== main (no branch) =="
          curl -sS -u "$SONAR_TOKEN:" "https://sonarcloud.io/api/qualitygates/project_status?projectKey=$PROJECT"
          echo ""
          echo "== branch=main =="
          curl -sS -u "$SONAR_TOKEN:" "https://sonarcloud.io/api/qualitygates/project_status?projectKey=$PROJECT&branch=main"
          echo ""
          echo "== measures =="
          curl -sS -u "$SONAR_TOKEN:" "https://sonarcloud.io/api/measures/component?component=$PROJECT&branch=main&metricKeys=coverage,new_coverage,new_bugs,new_code_smells,new_vulnerabilities,new_duplicated_lines_density,new_security_hotspots_reviewed,new_maintainability_rating,new_reliability_rating,new_security_rating"

      - name: Final listing
        if: always()
        run: |
          curl -sS -u "$SONAR_TOKEN:" "https://sonarcloud.io/api/project_branches/list?project=$PROJECT" || true
