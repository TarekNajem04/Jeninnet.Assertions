name: Sonar Maintenance

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Operation to run against the SonarCloud project"
        required: true
        default: "list"
        type: choice
        options:
          - "list"
          - "rename-main"
          - "quality-gate"
          - "show-new-code"
          - "set-new-code-days"

permissions:
  contents: read

jobs:
  maintenance:
    name: SonarCloud maintenance
    runs-on: ubuntu-latest

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      PROJECT: jeninnet-assertions

    steps:
      - name: List branches
        if: inputs.action == 'list'
        run: |
          curl -sS -u "$SONAR_TOKEN:" "https://sonarcloud.io/api/project_branches/list?project=$PROJECT"
          echo ""
          curl -sS -u "$SONAR_TOKEN:" "https://sonarcloud.io/api/components/show?component=$PROJECT"

      - name: Rename main branch
        if: inputs.action == 'rename-main'
        run: |
          curl -sS -u "$SONAR_TOKEN:" -X POST "https://sonarcloud.io/api/project_branches/rename?project=$PROJECT&name=main"

      - name: Show new code period
        if: inputs.action == 'show-new-code'
        run: |
          curl -sS -u "$SONAR_TOKEN:" "https://sonarcloud.io/api/settings/values?component=$PROJECT&keys=sonar.leak.period,sonar.newCode.referenceBranch"

      - name: Set new code period to 30 days
        if: inputs.action == 'set-new-code-days'
        run: |
          curl -sS -u "$SONAR_TOKEN:" -X POST "https://sonarcloud.io/api/settings/set?component=$PROJECT&key=sonar.leak.period&value=30"
          echo ""
          curl -sS -u "$SONAR_TOKEN:" "https://sonarcloud.io/api/settings/values?component=$PROJECT&keys=sonar.leak.period,sonar.newCode.referenceBranch"

      - name: Quality gate details
        if: inputs.action == 'quality-gate'
        run: |
          echo "== project status =="
          curl -sS -u "$SONAR_TOKEN:" "https://sonarcloud.io/api/qualitygates/project_status?projectKey=$PROJECT"
          echo ""
          echo "== gates for the project =="
          curl -sS -u "$SONAR_TOKEN:" "https://sonarcloud.io/api/qualitygates/get_by_project?project=$PROJECT"
          echo ""
          echo "== organization gates =="
          curl -sS -u "$SONAR_TOKEN:" "https://sonarcloud.io/api/qualitygates/list?organization=jeninnet"
          echo ""
          echo "== FileQuery reference: gate =="
          curl -sS -u "$SONAR_TOKEN:" "https://sonarcloud.io/api/qualitygates/get_by_project?project=jeninnet-file-query"
          echo ""
          echo "== FileQuery reference: status =="
          curl -sS -u "$SONAR_TOKEN:" "https://sonarcloud.io/api/qualitygates/project_status?projectKey=jeninnet-file-query"
          echo ""
          echo "== leak period: assertions =="
          curl -sS -u "$SONAR_TOKEN:" "https://sonarcloud.io/api/settings/values?component=jeninnet-assertions&keys=sonar.leak.period"
          echo ""
          echo "== leak period: file-query =="
          curl -sS -u "$SONAR_TOKEN:" "https://sonarcloud.io/api/settings/values?component=jeninnet-file-query&keys=sonar.leak.period"
          echo ""
          echo "== leak period: organization default =="
          curl -sS -u "$SONAR_TOKEN:" "https://sonarcloud.io/api/settings/values?organization=jeninnet&keys=sonar.leak.period"
