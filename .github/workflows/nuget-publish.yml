name: Publish NuGet Packages

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PACKAGES_DIR: artifacts/packages
  PROJECTS: >-
    src/Jeninnet.Assertions/Jeninnet.Assertions.csproj
    src/Jeninnet.Assertions.MSTest/Jeninnet.Assertions.MSTest.csproj
    src/Jeninnet.Assertions.Analyzer/Jeninnet.Assertions.Analyzer.csproj

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to NuGet
    runs-on: ubuntu-latest
    environment:
      name: production

    permissions:
      contents: write
      id-token: write

    steps:
      # ---------------------------------------------------------
      # 1) Checkout repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # ---------------------------------------------------------
      # 2) Setup .NET
      # ---------------------------------------------------------
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6.0.0
        with:
          # The SDK version comes from global.json.
          global-json-file: global.json

      - name: Install .NET 9 runtime for the analyzer tests
        uses: actions/setup-dotnet@v6.0.0
        with:
          # 9.0.x: the analyzer test project targets net9.0 and its test host needs the .NET 9 runtime.
          dotnet-version: 9.0.x

      # ---------------------------------------------------------
      # 3) Resolve Version from Tag
      # ---------------------------------------------------------
      - name: Resolve version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version: $VERSION"

      # ---------------------------------------------------------
      # 4) Verify the solution-wide version matches the Tag
      #    (Directory.Build.props owns <Version> for every package)
      # ---------------------------------------------------------
      - name: Verify solution version
        shell: pwsh
        run: |
          $expected = "${{ steps.version.outputs.version }}"
          $props = [xml](Get-Content -LiteralPath Directory.Build.props -Raw)
          $actual = @($props.Project.PropertyGroup | ForEach-Object { $_.Version } | Where-Object { $_ }) | Select-Object -First 1

          # NuGet treats 1.0.0 and 1.0.0.0 as the same version, so compare four-part numeric forms.
          function Get-FourPartVersion([string]$version) {
            $parts = @($version.Split('.'))
            while ($parts.Count -lt 4) { $parts += '0' }
            if ($parts.Count -ne 4 -or @($parts | Where-Object { $_ -notmatch '^\d+$' }).Count -ne 0) {
              return $null
            }
            return ($parts -join '.')
          }

          if ($actual -ne $expected) {
            $expectedNormalized = Get-FourPartVersion $expected
            $actualNormalized = Get-FourPartVersion $actual
            if ($null -eq $expectedNormalized -or $null -eq $actualNormalized -or $actualNormalized -ne $expectedNormalized) {
              throw "Validation failed: Directory.Build.props Version '$actual' does not match tag version '$expected'."
            }
          }

          Write-Host "Version verified: $actual"

      # ---------------------------------------------------------
      # 5) Build and Test
      # ---------------------------------------------------------
      - name: Pack library for the local consumer feed
        run: dotnet pack src/Jeninnet.Assertions/Jeninnet.Assertions.csproj --configuration Release --output artifacts/packages

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --configuration Release --no-restore

      - name: Run tests
        run: dotnet test --configuration Release --no-build --no-restore --logger "console;verbosity=normal"

      # ---------------------------------------------------------
      # 6) Pack Projects
      # ---------------------------------------------------------
      - name: Create output directory
        run: mkdir -p ${{ env.PACKAGES_DIR }}

      - name: Pack projects
        run: |
          for project in ${{ env.PROJECTS }}; do
            dotnet pack "$project" \
              --configuration Release \
              --no-build \
              --no-restore \
              /p:EnablePackageValidation=true \
              --output ${{ env.PACKAGES_DIR }}
          done

      # ---------------------------------------------------------
      # 7) Upload and Publish
      # ---------------------------------------------------------
      - name: Upload artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: nuget-packages-${{ steps.version.outputs.version }}
          path: ${{ env.PACKAGES_DIR }}
          retention-days: 30

      - name: NuGet login (OIDC)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841
        id: login
        with:
          user: ${{ vars.NUGET_USER }}

      # Symbols ride along with this push: NuGet pairs each sibling .snupkg and only
      # uploads it when the package upload itself succeeds. A separate
      # `dotnet nuget push *.snupkg` step must NOT exist: on a re-run for an
      # already-published version it would overwrite the published symbols with PDBs
      # from a different build (different commit), and nuget.org rejects that with
      # "The uploaded symbols package contains pdb(s) for a corresponding dll(s)
      # not found in the nuget package." (NuGet/Home#10475).
      - name: Push packages to NuGet
        run: |
          dotnet nuget push "${{ env.PACKAGES_DIR }}/*.nupkg" \
            --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      # ---------------------------------------------------------
      # 8) Create GitHub Release
      # ---------------------------------------------------------
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            ${{ env.PACKAGES_DIR }}/*.nupkg \
            ${{ env.PACKAGES_DIR }}/*.snupkg \
            --title "Release v${{ steps.version.outputs.version }}" \
            --generate-notes
