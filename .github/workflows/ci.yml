name: CI

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'consumers/**'
      - 'samples/**'
      - '**.csproj'
      - '**.slnx'
      - 'Directory.Packages.props'
      - 'Directory.Build.props'
      - '.github/workflows/ci.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'consumers/**'
      - 'samples/**'
      - '**.csproj'
      - '**.slnx'
      - 'Directory.Packages.props'
      - 'Directory.Build.props'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  format:

    name: Format

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Pack library for the local consumer feed
        run: dotnet pack src/Jeninnet.Assertions/Jeninnet.Assertions.csproj --configuration Release --output artifacts/packages

      - name: Restore
        run: dotnet restore

      - name: Verify formatting
        run: dotnet format --verify-no-changes --no-restore

  build-and-test:

    name: Build & Test (${{ matrix.os }})

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          # 9.0.x: the analyzer test project targets net9.0 and its test host needs the .NET 9 runtime.
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Pack library for the local consumer feed
        run: dotnet pack src/Jeninnet.Assertions/Jeninnet.Assertions.csproj --configuration Release --output artifacts/packages

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test
          --configuration Release
          --no-build
          --logger "trx;LogFileName=results.trx"
          --results-directory TestResults/${{ matrix.os }}

      - name: Run TUnit sample suite (Microsoft.Testing.Platform)
        if: matrix.os == 'ubuntu-latest'
        run: >
          dotnet run
          --project samples/Jeninnet.Assertions.FrameworkZoo/Jeninnet.Assertions.FrameworkZoo.TUnit.Tests/Jeninnet.Assertions.FrameworkZoo.TUnit.Tests.csproj
          --configuration Release

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/${{ matrix.os }}

  package-validation:

    name: Package Validation

    runs-on: ubuntu-latest

    needs:
      - build-and-test

    steps:

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Pack library for the local consumer feed
        run: dotnet pack src/Jeninnet.Assertions/Jeninnet.Assertions.csproj --configuration Release --output artifacts/packages

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Pack with Validation
        run: |
          dotnet pack src/Jeninnet.Assertions/Jeninnet.Assertions.csproj \
            -c Release \
            /p:EnablePackageValidation=true

          dotnet pack src/Jeninnet.Assertions.MSTest/Jeninnet.Assertions.MSTest.csproj \
            -c Release \
            /p:EnablePackageValidation=true

          dotnet pack src/Jeninnet.Assertions.Analyzer/Jeninnet.Assertions.Analyzer.csproj \
            -c Release \
            /p:EnablePackageValidation=true
